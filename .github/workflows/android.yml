name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: "35"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  verify:
    name: Test, inspect, and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo '::error::GitHub runner does not provide an Android SDK root.'
            exit 1
          fi
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager"
          "$sdkmanager" "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"
          printf 'ANDROID_SDK_ROOT=%s\n' "$sdk_root" >> "$GITHUB_ENV"

      - name: Test, lint, and build debug APK
        shell: bash
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Verify APK signature, identity, and permissions
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          tools="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}"
          test -s "$apk"
          "$tools/apksigner" verify --verbose "$apk"

          badging="$($tools/aapt2 dump badging "$apk")"
          grep -q "package: name='jp.sugunoru.app'" <<<"$badging"

          expected_permissions="$(mktemp)"
          actual_permissions="$(mktemp)"
          printf '%s\n' \
            'android.permission.ACCESS_NETWORK_STATE' \
            'android.permission.INTERNET' \
            'android.permission.POST_NOTIFICATIONS' \
            'android.permission.VIBRATE' | sort -u > "$expected_permissions"
          "$tools/aapt2" dump permissions "$apk" \
            | sed -n "s/^uses-permission[^:]*: name='\([^']*\)'.*/\1/p" \
            | sort -u > "$actual_permissions"
          if ! diff -u "$expected_permissions" "$actual_permissions"; then
            echo '::error::APK permissions differ from the approved allowlist.'
            exit 1
          fi

          mkdir -p dist
          cp "$apk" "dist/sugunoru-debug-${GITHUB_SHA}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sugunoru-debug-${{ github.sha }}
          path: dist/sugunoru-debug-${{ github.sha }}.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
