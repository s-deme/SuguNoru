plugins {
    id 'com.android.application'
}

def releaseSigning = [
        keystorePath: System.getenv('ANDROID_KEYSTORE_PATH'),
        storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
        keyAlias: System.getenv('ANDROID_KEY_ALIAS'),
        keyPassword: System.getenv('ANDROID_KEY_PASSWORD')
]
def missingReleaseSigning = releaseSigning.findAll { entry ->
    entry.value == null || entry.value.trim().isEmpty()
}.keySet()

android {
    namespace 'jp.sugunoru.app'
    compileSdk 35

    defaultConfig {
        applicationId 'jp.sugunoru.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '2.1.1'

        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    buildFeatures {
        buildConfig = false
    }

    signingConfigs {
        release {
            if (missingReleaseSigning.isEmpty()) {
                storeFile file(releaseSigning.keystorePath)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

gradle.taskGraph.whenReady { graph ->
    boolean containsReleaseTask = graph.allTasks.any { task ->
        task.path.toLowerCase(java.util.Locale.ROOT).contains('release')
    }
    if (containsReleaseTask && !missingReleaseSigning.isEmpty()) {
        throw new GradleException('Release signing is incomplete. Set ANDROID_KEYSTORE_PATH, '
                + 'ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD.')
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
